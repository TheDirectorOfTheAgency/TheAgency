<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Labubu Dress-Up ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', cursive, sans-serif;
  background: linear-gradient(135deg, #ffe0f0 0%, #e0f0ff 50%, #f0ffe0 100%);
  min-height: 100vh;
  color: #3d1a5e;
}

.app { min-height: 100vh; display: flex; flex-direction: column; }

.header {
  text-align: center;
  padding: 18px 16px 10px;
  background: linear-gradient(135deg, #ff85a1, #f9c74f, #a29bfe);
  border-bottom: 4px solid #fff;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12);
}
.title {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(2rem, 6vw, 3.2rem);
  color: white;
  text-shadow: 3px 3px 0 #c03070;
  letter-spacing: 2px;
}
.title-star { display: inline-block; animation: spin-star 3s linear infinite; }
@keyframes spin-star { 0%{transform:rotate(0) scale(1)} 50%{transform:rotate(180deg) scale(1.3)} 100%{transform:rotate(360deg) scale(1)} }
.subtitle { font-size: 1.1rem; color: #fff8; font-weight: 700; margin-top: 2px; }

.main {
  display: flex; flex: 1; gap: 20px;
  padding: 16px 20px 24px;
  max-width: 1100px; margin: 0 auto; width: 100%;
}

.stage-col { display: flex; flex-direction: column; align-items: center; gap: 12px; flex: 0 0 270px; }

.name-badge {
  display: flex; align-items: center; gap: 8px;
  background: white; border-radius: 999px; padding: 8px 20px;
  box-shadow: 0 4px 16px #ff85a140; border: 3px solid #ff85a1;
}
.character-name { font-family: 'Fredoka One', cursive; font-size: 1.5rem; color: #b5179e; }
#name-input {
  font-family: 'Fredoka One', cursive; font-size: 1.3rem;
  border: 2px solid #ff85a1; border-radius: 8px; padding: 4px 10px;
  color: #b5179e; width: 140px; outline: none;
}
.icon-btn { background: none; border: none; cursor: pointer; font-size: 1.1rem; padding: 2px 6px; border-radius: 6px; }
.icon-btn:hover { background: #ffe0f0; }
.name-save-btn { background: #ff85a1; color: white; font-weight: 700; border: none; border-radius: 8px; padding: 4px 10px; cursor: pointer; font-family: 'Fredoka One', cursive; }

.character-wrap {
  position: relative; width: 260px;
  background: white; border-radius: 28px;
  box-shadow: 0 8px 32px #b5179e22; border: 4px solid #ffb3d9; padding: 8px; overflow: hidden;
}
#labubu-svg { width: 100%; height: auto; display: block; }

.stage-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.btn {
  font-family: 'Fredoka One', cursive; font-size: 1rem;
  padding: 10px 18px; border: none; border-radius: 999px; cursor: pointer;
  transition: transform .12s, box-shadow .12s; box-shadow: 0 4px 10px #0002; letter-spacing: .5px;
}
.btn:hover { transform: scale(1.07); box-shadow: 0 6px 16px #0003; }
.btn:active { transform: scale(0.97); }
.btn-random { background: linear-gradient(135deg,#ffd6e0,#f9c74f); color: #7b2d8b; }
.btn-save   { background: linear-gradient(135deg,#a29bfe,#74b9ff); color: white; }
.btn-reset  { background: linear-gradient(135deg,#ff85a1,#fd79a8); color: white; }

.panel-col { flex: 1; min-width: 0; }
.panel {
  background: white; border-radius: 24px; box-shadow: 0 8px 32px #a29bfe22;
  border: 3px solid #e8d5ff; overflow: hidden; display: flex; flex-direction: column;
}

.tabs {
  display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 10px 0;
  background: linear-gradient(135deg,#ffe0f0,#e8d5ff); border-bottom: 3px solid #f0d0ff;
}
.tab-btn {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 7px 10px; border: 2px solid transparent; border-radius: 12px 12px 0 0;
  background: #fff8; cursor: pointer; font-family: 'Nunito', sans-serif;
  font-size: .7rem; font-weight: 700; color: #7b2d8b; transition: background .15s, transform .1s;
}
.tab-btn:hover { background: white; transform: translateY(-2px); }
.tab-btn.active { background: white; border-color: #b5179e; color: #b5179e; transform: translateY(-2px); }
.tab-btn .tab-icon { font-size: 1.4rem; }
.tab-label { font-size: .62rem; white-space: nowrap; }

.items-grid {
  padding: 14px; display: grid;
  grid-template-columns: repeat(auto-fill, minmax(86px, 1fr));
  gap: 10px; overflow-y: auto; max-height: 500px;
}

.item-btn {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 10px 6px; border: 3px solid #e8d5ff; border-radius: 16px;
  background: #fdf8ff; cursor: pointer; transition: all .15s; font-family: 'Nunito', sans-serif; width: 100%;
}
.item-btn:hover { border-color: #b5179e; background: #ffe0f0; transform: scale(1.06); }
.item-btn.selected {
  border-color: #b5179e; background: linear-gradient(135deg,#ffe0f0,#e8d5ff);
  box-shadow: 0 0 0 3px #ff85a160, 0 4px 12px #b5179e30;
}
.item-emoji { font-size: 2rem; line-height: 1; }
.item-label { font-size: .68rem; font-weight: 700; color: #7b2d8b; text-align: center; }

.section-title {
  grid-column: 1/-1; font-family: 'Fredoka One', cursive;
  font-size: 1.1rem; color: #b5179e; margin: 4px 0;
}
.swatch-row { grid-column: 1/-1; display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.swatch-btn {
  width: 44px; height: 44px; border-radius: 50%; border: 4px solid #e8d5ff;
  cursor: pointer; transition: all .15s; box-shadow: 0 2px 6px #0002;
}
.swatch-btn:hover { transform: scale(1.18); border-color: #b5179e; }
.swatch-btn.selected { border-color: #b5179e; box-shadow: 0 0 0 3px #ff85a160; transform: scale(1.12); }

.confetti-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 10; overflow: hidden; }
.confetti-piece { position: absolute; top: -20px; animation: fall 1.6s ease-in forwards; }
@keyframes fall { 0%{top:-20px;transform:rotate(0) scale(1);opacity:1} 80%{opacity:1} 100%{top:110%;transform:rotate(720deg) scale(.7);opacity:0} }

.footer {
  text-align: center; padding: 14px;
  font-family: 'Fredoka One', cursive; font-size: 1.1rem; color: #b5179e;
  background: #fff6; border-top: 3px dashed #ffb3d9; letter-spacing: 1px;
}

@media (max-width: 660px) {
  .main { flex-direction: column; align-items: center; padding: 10px; }
  .stage-col { flex: none; }
  .items-grid { max-height: 260px; }
}
</style>
</head>
<body>
<div class="app">

  <header class="header">
    <h1 class="title">
      <span class="title-star">✨</span> Labubu Dress-Up <span class="title-star">✨</span>
    </h1>
    <p class="subtitle">Create your very own Labubu!</p>
  </header>

  <main class="main">

    <div class="stage-col">
      <div class="name-badge" id="name-display">
        <span class="character-name" id="name-text">Sparkle</span>
        <button class="icon-btn" onclick="startEditName()" title="Edit name">✏️</button>
      </div>

      <div class="character-wrap">
        <div class="confetti-overlay" id="confetti"></div>
        <svg id="labubu-svg" viewBox="0 0 260 430" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>

      <div class="stage-actions">
        <button class="btn btn-random" onclick="randomName()">🎲 New Name</button>
        <button class="btn btn-save"   onclick="celebrate()">💾 Save Look</button>
        <button class="btn btn-reset"  onclick="resetOutfit()">🔄 Reset</button>
      </div>
    </div>

    <div class="panel-col">
      <div class="panel">
        <div class="tabs" id="tabs"></div>
        <div class="items-grid" id="items-grid"></div>
      </div>
    </div>

  </main>

  <footer class="footer">Made with 💗 for Malia</footer>
</div>

<script>
const RAINBOW = 'url(#rainbowGrad)';

const ACCESSORIES = {
  hats:      { label:'Hats',           icon:'🎩', items:[
    { id:'hat_none',    label:'No Hat',       emoji:'' },
    { id:'hat_crown',   label:'Crown',        emoji:'👑' },
    { id:'hat_bow',     label:'Big Bow',      emoji:'🎀' },
    { id:'hat_party',   label:'Party Hat',    emoji:'🎉' },
    { id:'hat_flower',  label:'Flower Hat',   emoji:'🌸' },
    { id:'hat_sun',     label:'Sun Hat',      emoji:'🌻' },
    { id:'hat_baseball',label:'Cap',          emoji:'🧢' },
    { id:'hat_witch',   label:'Witch Hat',    emoji:'🧙' },
    { id:'hat_unicorn', label:'Unicorn Horn', emoji:'🦄' },
  ]},
  tops:      { label:'Tops & Dresses', icon:'👗', items:[
    { id:'top_none',          label:'No Outfit',     emoji:'✕',  color:'#ffd6e7' },
    { id:'top_dress_pink',    label:'Pink Dress',    emoji:'👗', color:'#ff85a1' },
    { id:'top_dress_blue',    label:'Blue Dress',    emoji:'💙', color:'#74b9ff' },
    { id:'top_dress_purple',  label:'Purple Dress',  emoji:'💜', color:'#a29bfe' },
    { id:'top_overalls',      label:'Overalls',      emoji:'👖', color:'#4a90e2' },
    { id:'top_tshirt_rainbow',label:'Rainbow Tee',   emoji:'🌈', color:'rainbow' },
    { id:'top_sweater',       label:'Cozy Sweater',  emoji:'🧶', color:'#fd79a8' },
    { id:'top_tutu',          label:'Tutu',          emoji:'🩰', color:'#ffb3c1' },
  ]},
  necklaces: { label:'Necklaces',      icon:'📿', items:[
    { id:'neck_none',      label:'None',          emoji:'' },
    { id:'neck_pearls',    label:'Pearls',        emoji:'🫧' },
    { id:'neck_heart',     label:'Heart Locket',  emoji:'❤️' },
    { id:'neck_star',      label:'Star Chain',    emoji:'⭐' },
    { id:'neck_rainbow',   label:'Rainbow Beads', emoji:'🌈' },
    { id:'neck_butterfly', label:'Butterfly',     emoji:'🦋' },
    { id:'neck_flower',    label:'Flower Beads',  emoji:'🌺' },
  ]},
  bags:      { label:'Purses & Bags',  icon:'👜', items:[
    { id:'bag_none',       label:'No Bag',        emoji:'' },
    { id:'bag_purse_pink', label:'Pink Purse',    emoji:'👛' },
    { id:'bag_handbag',    label:'Handbag',       emoji:'👜' },
    { id:'bag_backpack',   label:'Mini Backpack', emoji:'🎒' },
    { id:'bag_star',       label:'Star Bag',      emoji:'⭐' },
    { id:'bag_heart',      label:'Heart Bag',     emoji:'💗' },
    { id:'bag_rainbow',    label:'Rainbow Bag',   emoji:'🌈' },
  ]},
  shoes:     { label:'Shoes',          icon:'👟', items:[
    { id:'shoes_none',    label:'None',           emoji:'' },
    { id:'shoes_sneakers',label:'Sneakers',       emoji:'👟' },
    { id:'shoes_heels',   label:'Sparkle Heels',  emoji:'👠' },
    { id:'shoes_boots',   label:'Boots',          emoji:'🥾' },
    { id:'shoes_ballet',  label:'Ballet Flats',   emoji:'🩰' },
    { id:'shoes_rainbow', label:'Rainbow Shoes',  emoji:'🌈', color:'rainbow' },
    { id:'shoes_pink',    label:'Pink Shoes',     emoji:'🩷', color:'#ff85a1' },
  ]},
  makeup:    { label:'Face & Blush',   icon:'💄', items:[
    { id:'makeup_none',        label:'No Makeup',      emoji:'' },
    { id:'makeup_blush',       label:'Pink Blush',     emoji:'🌸', blush:'#ffb3c6' },
    { id:'makeup_blush_peach', label:'Peach Blush',    emoji:'🍑', blush:'#ffd6a5' },
    { id:'makeup_lips_red',    label:'Red Lips',       emoji:'💋', lips:'#e63946' },
    { id:'makeup_lips_pink',   label:'Pink Lips',      emoji:'🩷', lips:'#ff85a1' },
    { id:'makeup_glitter',     label:'Glitter Cheeks', emoji:'✨', blush:'#ffd6e0', glitter:true },
    { id:'makeup_rainbow_eyes',label:'Rainbow Eyes',   emoji:'🌈', eyes:'rainbow' },
    { id:'makeup_stars',       label:'Star Stickers',  emoji:'⭐', stars:true },
  ]},
  extras:    { label:'Extras',         icon:'✨', items:[
    { id:'extra_none',         label:'None',           emoji:'' },
    { id:'extra_glasses',      label:'Sunglasses',     emoji:'😎' },
    { id:'extra_wings',        label:'Fairy Wings',    emoji:'🧚' },
    { id:'extra_wand',         label:'Magic Wand',     emoji:'🪄' },
    { id:'extra_flowers',      label:'Flowers',        emoji:'🌺' },
    { id:'extra_heart_balloon',label:'Heart Balloon',  emoji:'🎈' },
    { id:'extra_sparkles',     label:'Sparkles',       emoji:'✨' },
  ]},
};

// Labubu comes in many colourways — "fur" instead of skin
const FUR_COLORS = [
  { id:'fur_cream',  label:'Classic Cream', color:'#F5DEB3' },
  { id:'fur_pink',   label:'Bubblegum',     color:'#FFB3C6' },
  { id:'fur_purple', label:'Lavender',      color:'#C9B1FF' },
  { id:'fur_blue',   label:'Sky Blue',      color:'#A8D8EA' },
  { id:'fur_mint',   label:'Mint',          color:'#B5EAD7' },
  { id:'fur_grey',   label:'Silver',        color:'#D3D3D3' },
  { id:'fur_brown',  label:'Caramel',       color:'#C68642' },
  { id:'fur_black',  label:'Midnight',      color:'#3a3a3a' },
];

const EYE_COLORS = [
  { id:'eye_black',  label:'Black',   color:'#1a1a1a' },
  { id:'eye_brown',  label:'Brown',   color:'#6B4423' },
  { id:'eye_blue',   label:'Blue',    color:'#4CC9F0' },
  { id:'eye_purple', label:'Purple',  color:'#B5179E' },
  { id:'eye_rainbow',label:'Rainbow', color:'rainbow' },
];

const NAMES = ['Sparkle','Bubbles','Starshine','Cotton Candy','Rainbow','Glitter','Blossom','Twinkle','Cupcake','Petal','Mochi','Boba','Lulu','Kiki','Mimo'];

let outfit = {
  hats:'hat_none', tops:'top_dress_pink',
  necklaces:'neck_none', bags:'bag_none', shoes:'shoes_none',
  makeup:'makeup_blush', extras:'extra_none',
  furColor:'fur_cream', eyeColor:'eye_black',
};

let activeTab = 'hats';

function findItem(cat, id) {
  if (cat === 'fur') return FUR_COLORS.find(s => s.id === id);
  if (cat === 'eye') return EYE_COLORS.find(e => e.id === id);
  return ACCESSORIES[cat]?.items.find(i => i.id === id);
}

function colorFill(color) {
  return (color === 'rainbow' || color == null) ? RAINBOW : color;
}

function svgEl(tag, attrs, children) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  if (Array.isArray(children)) children.forEach(c => c && el.appendChild(c));
  else if (typeof children === 'string') el.textContent = children;
  return el;
}

function txt(x, y, content, size, anchor) {
  return svgEl('text', { x, y, 'font-size': size || 30, 'text-anchor': anchor || 'middle', 'dominant-baseline':'auto' }, content);
}

// Draw a spiky/fluffy fur border as a polygon around a centre point
function furRing(cx, cy, rInner, rOuter, spikes, fill, opac) {
  const pts = [];
  for (let i = 0; i < spikes * 2; i++) {
    const angle = (Math.PI * 2 * i) / (spikes * 2) - Math.PI / 2;
    const r = i % 2 === 0 ? rOuter : rInner;
    pts.push(`${cx + Math.cos(angle) * r},${cy + Math.sin(angle) * r}`);
  }
  const attrs = { points: pts.join(' '), fill };
  if (opac != null) attrs.opacity = opac;
  return svgEl('polygon', attrs);
}

// ─────────────────────────────────────────
//  SVG CHARACTER RENDERER — Labubu style
// ─────────────────────────────────────────
function buildSVG() {
  const svg = document.getElementById('labubu-svg');
  svg.innerHTML = '';

  const fur   = FUR_COLORS.find(f => f.id === outfit.furColor) || FUR_COLORS[0];
  const eye   = EYE_COLORS.find(e => e.id === outfit.eyeColor) || EYE_COLORS[0];
  const hat   = findItem('hats',      outfit.hats);
  const top   = findItem('tops',      outfit.tops);
  const neck  = findItem('necklaces', outfit.necklaces);
  const bag   = findItem('bags',      outfit.bags);
  const shoe  = findItem('shoes',     outfit.shoes);
  const mup   = findItem('makeup',    outfit.makeup);
  const extra = findItem('extras',    outfit.extras);

  const fc  = fur.color;                                      // fur colour
  // Slightly darker shade for inner ear / detail
  const fc2 = fur.id === 'fur_black' ? '#555' : '#f9a8c9';
  const ec  = eye.color === 'rainbow' ? RAINBOW : eye.color;
  const tc  = top ? colorFill(top.color) : '#ffd6e7';
  const blush = mup?.blush || null;
  const lips  = mup?.lips  || null;

  // ── defs ──
  const defs = svgEl('defs');
  const rg = svgEl('linearGradient', { id:'rainbowGrad', x1:'0%', y1:'0%', x2:'100%', y2:'0%' });
  [['0%','#ff595e'],['17%','#ff924c'],['34%','#ffca3a'],['50%','#8ac926'],['67%','#1982c4'],['84%','#6a4c93'],['100%','#ff595e']]
    .forEach(([off,col]) => { const s = svgEl('stop'); s.setAttribute('offset',off); s.setAttribute('stop-color',col); rg.appendChild(s); });
  defs.appendChild(rg);

  if (blush) {
    const bg = svgEl('radialGradient', { id:'blushG', cx:'50%', cy:'50%', r:'50%' });
    [['0%',blush,'0.75'],['100%',blush,'0']].forEach(([off,col,op]) => {
      const s = svgEl('stop'); s.setAttribute('offset',off); s.setAttribute('stop-color',col); s.setAttribute('stop-opacity',op); bg.appendChild(s);
    });
    defs.appendChild(bg);
  }
  svg.appendChild(defs);

  function add(...els) { els.forEach(e => e && svg.appendChild(e)); }

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // BODY — plump round torso
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  if (top && top.id !== 'top_none') {
    // Fluffy body silhouette
    add(furRing(130, 315, 52, 62, 10, fc, 0.55));
    add(svgEl('ellipse', { cx:130, cy:315, rx:52, ry:68, fill:tc }));

    if (top.id === 'top_tutu') {
      add(svgEl('ellipse', { cx:130, cy:308, rx:66, ry:20, fill:'#ffb3c1', opacity:.85 }));
      add(svgEl('ellipse', { cx:130, cy:316, rx:60, ry:16, fill:'#ffd6e0', opacity:.75 }));
    }
    if (top.id === 'top_overalls') {
      add(svgEl('rect', { x:112, y:248, width:12, height:46, rx:6, fill:'#2563eb' }));
      add(svgEl('rect', { x:136, y:248, width:12, height:46, rx:6, fill:'#2563eb' }));
    }
  }

  // ── Stubby arms ──
  // Left arm
  add(svgEl('ellipse', { cx:76, cy:296, rx:15, ry:34, fill:fc, transform:'rotate(-18 76 296)' }));
  add(furRing(58, 326, 10, 16, 6, fc, 0.7));
  add(svgEl('circle', { cx:58, cy:326, r:13, fill:fc }));

  // Right arm
  add(svgEl('ellipse', { cx:184, cy:296, rx:15, ry:34, fill:fc, transform:'rotate(18 184 296)' }));
  add(furRing(202, 326, 10, 16, 6, fc, 0.7));
  add(svgEl('circle', { cx:202, cy:326, r:13, fill:fc }));

  // Bag (held in right hand)
  if (bag && bag.id !== 'bag_none') add(txt(218, 338, bag.emoji, 28));

  // ── Stubby legs ──
  add(svgEl('ellipse', { cx:108, cy:378, rx:16, ry:30, fill:fc }));
  add(svgEl('ellipse', { cx:152, cy:378, rx:16, ry:30, fill:fc }));

  // Feet / shoes
  if (shoe && shoe.id !== 'shoes_none') {
    if (shoe.color) {
      const sf = colorFill(shoe.color);
      add(svgEl('ellipse', { cx:106, cy:406, rx:20, ry:10, fill:sf }));
      add(svgEl('ellipse', { cx:154, cy:406, rx:20, ry:10, fill:sf }));
    } else {
      add(txt(105, 420, shoe.emoji, 22));
      add(txt(153, 420, shoe.emoji, 22));
    }
  } else {
    // bare paws
    add(furRing(108, 406, 12, 18, 5, fc, 0.7));
    add(svgEl('ellipse', { cx:108, cy:406, rx:18, ry:10, fill:fc }));
    add(furRing(152, 406, 12, 18, 5, fc, 0.7));
    add(svgEl('ellipse', { cx:152, cy:406, rx:18, ry:10, fill:fc }));
  }

  // Neck join
  add(svgEl('rect', { x:116, y:235, width:28, height:22, rx:10, fill:fc }));
  if (neck && neck.id !== 'neck_none') add(txt(130, 275, neck.emoji, 18));

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // HEAD — big round Labubu head
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // Fluffy fur halo behind head
  add(furRing(130, 183, 60, 74, 14, fc, 0.5));

  // ── Pointy ears (signature Labubu feature) ──
  // Left ear — tall triangle with inner colour
  add(svgEl('polygon', { points:'68,185  52,95  92,155', fill:fc }));
  add(svgEl('polygon', { points:'72,178  60,108  88,158', fill:fc2 }));

  // Right ear
  add(svgEl('polygon', { points:'192,185 208,95 168,155', fill:fc }));
  add(svgEl('polygon', { points:'188,178 200,108 172,158', fill:fc2 }));

  // Main head circle
  add(svgEl('circle', { cx:130, cy:183, r:62, fill:fc }));

  // ── Cheek blush ──
  if (blush) {
    add(svgEl('ellipse', { cx:96,  cy:202, rx:22, ry:14, fill:'url(#blushG)' }));
    add(svgEl('ellipse', { cx:164, cy:202, rx:22, ry:14, fill:'url(#blushG)' }));
  }
  if (mup?.glitter) {
    add(txt(90, 200, '✨', 11)); add(txt(158, 200, '✨', 11));
  }
  if (mup?.stars) {
    add(txt(90, 200, '⭐', 12)); add(txt(158, 200, '⭐', 12));
  }

  // ── Eyes — large, round, expressive ──
  // Whites
  add(svgEl('ellipse', { cx:108, cy:178, rx:17, ry:20, fill:'white' }));
  add(svgEl('ellipse', { cx:152, cy:178, rx:17, ry:20, fill:'white' }));
  // Iris
  const eyeFill = mup?.eyes === 'rainbow' ? RAINBOW : ec;
  add(svgEl('circle', { cx:108, cy:180, r:12, fill:eyeFill }));
  add(svgEl('circle', { cx:152, cy:180, r:12, fill:eyeFill }));
  // Pupil
  add(svgEl('circle', { cx:109, cy:181, r:7,  fill:'#0a0a0a' }));
  add(svgEl('circle', { cx:153, cy:181, r:7,  fill:'#0a0a0a' }));
  // Highlight specks
  add(svgEl('circle', { cx:113, cy:176, r:3,  fill:'white' }));
  add(svgEl('circle', { cx:157, cy:176, r:3,  fill:'white' }));
  add(svgEl('circle', { cx:105, cy:185, r:1.5,fill:'white' }));
  add(svgEl('circle', { cx:149, cy:185, r:1.5,fill:'white' }));

  // Eye rainbow override colour patch
  if (mup?.eyes === 'rainbow') {
    add(svgEl('circle', { cx:108, cy:180, r:12, fill:RAINBOW, opacity:.85 }));
    add(svgEl('circle', { cx:152, cy:180, r:12, fill:RAINBOW, opacity:.85 }));
    add(svgEl('circle', { cx:109, cy:181, r:7,  fill:'#0a0a0a' }));
    add(svgEl('circle', { cx:153, cy:181, r:7,  fill:'#0a0a0a' }));
    add(svgEl('circle', { cx:113, cy:176, r:3,  fill:'white' }));
    add(svgEl('circle', { cx:157, cy:176, r:3,  fill:'white' }));
  }

  // Upper lashes (thick arcs)
  add(svgEl('path', { d:'M93 163 Q108 155 123 163', stroke:'#1a1a1a', 'stroke-width':3.5, fill:'none', 'stroke-linecap':'round' }));
  add(svgEl('path', { d:'M137 163 Q152 155 167 163', stroke:'#1a1a1a', 'stroke-width':3.5, fill:'none', 'stroke-linecap':'round' }));

  // ── Tiny round nose ──
  add(svgEl('ellipse', { cx:130, cy:198, rx:6, ry:5, fill:'#b56a50', opacity:.7 }));
  add(svgEl('ellipse', { cx:130, cy:197, rx:3, ry:2.5, fill:'#7a3a20', opacity:.5 }));

  // ── The Labubu signature toothy grin ──
  // Wide open mouth
  add(svgEl('path', { d:'M104 212 Q130 238 156 212', fill:'#1a0808', stroke:'none' }));
  // Row of little teeth
  const teethY = 213;
  const teethGap = 8;
  const teethStart = 108;
  const numTeeth = 6;
  for (let i = 0; i < numTeeth; i++) {
    add(svgEl('rect', {
      x: teethStart + i * teethGap,
      y: teethY,
      width: 6, height: 9, rx: 2,
      fill: 'white'
    }));
  }
  // Bottom lip hint
  if (lips) {
    add(svgEl('path', { d:'M104 212 Q130 240 156 212', stroke:lips, 'stroke-width':3, fill:'none', 'stroke-linecap':'round', opacity:.8 }));
  }

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // HAT (on top of head / between ears)
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  if (hat && hat.id !== 'hat_none') {
    add(txt(130, 126, hat.emoji, hat.id === 'hat_unicorn' ? 36 : 44));
  }

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // EXTRAS
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  if (extra && extra.id !== 'extra_none') {
    if (extra.id === 'extra_glasses') {
      add(txt(130, 192, '😎', 32));
    } else if (extra.id === 'extra_wings') {
      add(txt(130, 295, extra.emoji, 38));
    } else {
      add(txt(44, 318, extra.emoji, 34));
    }
  }
}

// ─────────────────────────────────────────
//  UI: TABS + ITEMS
// ─────────────────────────────────────────
function buildTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  const cats = [...Object.keys(ACCESSORIES), 'fur'];
  cats.forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (key === activeTab ? ' active' : '');
    const icon  = key === 'fur' ? '🎨' : ACCESSORIES[key].icon;
    const label = key === 'fur' ? 'Fur & Eyes' : ACCESSORIES[key].label;
    btn.innerHTML = `<span class="tab-icon">${icon}</span><span class="tab-label">${label}</span>`;
    btn.onclick = () => { activeTab = key; buildTabs(); buildItems(); };
    tabs.appendChild(btn);
  });
}

function buildItems() {
  const grid = document.getElementById('items-grid');
  grid.innerHTML = '';

  if (activeTab === 'fur') {
    const t = document.createElement('p');
    t.className = 'section-title'; t.textContent = 'Fur Colour';
    grid.appendChild(t);
    const sr = document.createElement('div'); sr.className = 'swatch-row';
    FUR_COLORS.forEach(f => sr.appendChild(makeSwatch(f, outfit.furColor, id => { outfit.furColor = id; buildItems(); buildSVG(); })));
    grid.appendChild(sr);

    const t2 = document.createElement('p');
    t2.className = 'section-title'; t2.textContent = 'Eye Colour';
    grid.appendChild(t2);
    const sr2 = document.createElement('div'); sr2.className = 'swatch-row';
    EYE_COLORS.forEach(e => sr2.appendChild(makeSwatch(e, outfit.eyeColor, id => { outfit.eyeColor = id; buildItems(); buildSVG(); })));
    grid.appendChild(sr2);
    return;
  }

  ACCESSORIES[activeTab].items.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'item-btn' + (outfit[activeTab] === item.id ? ' selected' : '');
    btn.innerHTML = `<span class="item-emoji">${item.emoji || '✕'}</span><span class="item-label">${item.label}</span>`;
    btn.onclick = () => { outfit[activeTab] = item.id; buildItems(); buildSVG(); };
    grid.appendChild(btn);
  });
}

function makeSwatch(item, selectedId, onSelect) {
  const btn = document.createElement('button');
  btn.className = 'swatch-btn' + (selectedId === item.id ? ' selected' : '');
  btn.title = item.label;
  if (item.color === 'rainbow') {
    btn.style.background = 'linear-gradient(135deg,#ff595e,#ffca3a,#8ac926,#1982c4,#6a4c93)';
  } else {
    btn.style.background = item.color;
    if (item.id === 'fur_black') btn.style.border = '4px solid #888';
  }
  btn.onclick = () => onSelect(item.id);
  return btn;
}

// ─────────────────────────────────────────
//  NAME EDITING
// ─────────────────────────────────────────
function startEditName() {
  const badge = document.getElementById('name-display');
  const cur = document.getElementById('name-text').textContent;
  badge.innerHTML = `<input id="name-input" maxlength="16" value="${cur}" /><button class="name-save-btn" onclick="saveName()">Save</button>`;
  const inp = document.getElementById('name-input');
  inp.focus(); inp.select();
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') saveName(); });
}

function saveName() {
  const val = (document.getElementById('name-input')?.value || '').trim() || 'Sparkle';
  document.getElementById('name-display').innerHTML =
    `<span class="character-name" id="name-text">${val}</span><button class="icon-btn" onclick="startEditName()" title="Edit name">✏️</button>`;
}

function randomName() {
  const n = NAMES[Math.floor(Math.random() * NAMES.length)];
  document.getElementById('name-display').innerHTML =
    `<span class="character-name" id="name-text">${n}</span><button class="icon-btn" onclick="startEditName()" title="Edit name">✏️</button>`;
}

// ─────────────────────────────────────────
//  CONFETTI
// ─────────────────────────────────────────
const CONF_COLORS = ['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93','#ff85a1','#a29bfe'];

function celebrate() {
  const c = document.getElementById('confetti');
  c.innerHTML = '';
  for (let i = 0; i < 32; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    const sz = 8 + Math.random() * 10;
    p.style.cssText = `left:${Math.random()*100}%;width:${sz}px;height:${sz}px;background:${CONF_COLORS[i%CONF_COLORS.length]};border-radius:${Math.random()>.5?'50%':'2px'};animation-delay:${Math.random()*.8}s;`;
    c.appendChild(p);
  }
  setTimeout(() => c.innerHTML = '', 2000);
}

function resetOutfit() {
  outfit = {
    hats:'hat_none', tops:'top_dress_pink',
    necklaces:'neck_none', bags:'bag_none', shoes:'shoes_none',
    makeup:'makeup_blush', extras:'extra_none',
    furColor:'fur_cream', eyeColor:'eye_black',
  };
  buildItems(); buildSVG(); celebrate();
}

// ─────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────
buildTabs();
buildItems();
buildSVG();
</script>
